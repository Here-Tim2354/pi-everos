name: 功能建议
description: 想加的能力，或者现在用得不顺的地方
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        动手前先读 [CONTRIBUTING.md](https://github.com/Here-Tim2354/pi-everos/blob/main/CONTRIBUTING.md)
        末尾那份「会被拒绝的改法」，免得白写。

  - type: textarea
    id: scene
    attributes:
      label: 你遇到的场景
      description: 具体一点。什么情况下觉得缺了什么，现在只能怎么绕。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么做
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
      description: 包括为什么它们不够好

  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿
      options:
        - label: 我可以自己提 PR
        - label: 我可以帮忙测
